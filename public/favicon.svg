<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#10b981" stroke="#059669" stroke-width="2"/>
  
  <!-- Book icon -->
  <g transform="translate(50, 50)">
    <!-- Left page -->
    <path d="M -20 -15 L -20 15 L -2 18 L -2 -12 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    
    <!-- Right page -->
    <path d="M 2 -12 L 2 18 L 20 15 L 20 -15 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    
    <!-- Book spine -->
    <rect x="-2" y="-12" width="4" height="30" fill="#059669"/>
    
    <!-- Text lines on left page -->
    <line x1="-16" y1="-8" x2="-6" y2="-8" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-16" y1="-3" x2="-6" y2="-3" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-16" y1="2" x2="-6" y2="2" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Text lines on right page -->
    <line x1="6" y1="-8" x2="16" y2="-8" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="-3" x2="16" y2="-3" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="2" x2="16" y2="2" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>